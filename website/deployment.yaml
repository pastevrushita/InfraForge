
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraforge-deployment
  labels:
    app: infraforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infraforge
  template:
    metadata:
      labels:
        app: infraforge
    spec:
      containers:
        - name: infraforge-website
          image: ghcr.io/pastevrushita/infraforge-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
