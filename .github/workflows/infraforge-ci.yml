
name: InfraForge CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t infraforge-website:ci ./website

      - name: Build Backend Docker Image
        run: docker build -t infraforge-backend:ci ./website/backend

      - name: Verify Docker Images
        run: docker images
